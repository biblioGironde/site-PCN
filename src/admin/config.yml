# Configuration Sveltia CMS — https://github.com/sveltia/sveltia-cms
# Interface : https://<compte>.github.io/<depot>/admin/

backend:
  name: github
  repo: biblioGironde/site-PCN
  branch: main
  # Pour des éditeurs non techniques : déployer sveltia-cms-auth (Cloudflare Worker)
  # puis décommenter la ligne suivante. Sans elle, connexion par jeton GitHub.
  # base_url: https://sveltia-cms-auth.VOTRE-SOUS-DOMAINE.workers.dev

media_folder: src/media
public_folder: /media

locale: fr

collections:
  - name: actualites
    label: Actualités
    label_singular: Actualité
    folder: src/actualites
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    summary: "{{title}} — {{date | date('DD/MM/YYYY')}}"
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false, format: "YYYY-MM-DD" }
      - { name: resume, label: "Résumé (liste d'accueil)", widget: text, required: false }
      - { name: image, label: Image de couverture, widget: image, required: false }
      - { name: body, label: Contenu, widget: markdown }

  - name: pages
    label: Pages
    files:
      - name: a-propos
        label: Page « À propos »
        file: src/a-propos.md
        fields:
          - { name: layout, widget: hidden, default: base.njk }
          - { name: permalink, widget: hidden, default: /a-propos/ }
          - { name: title, label: Titre, widget: string }
          - { name: body, label: Contenu, widget: markdown }

      - name: site
        label: Réglages du site
        file: src/_data/site.json
        format: json
        fields:
          - { name: title, label: Nom du site, widget: string }
          - { name: description, label: Description, widget: text }
          - { name: footer, label: Pied de page, widget: string }
