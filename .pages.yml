# Configuration Pages CMS — https://pagescms.org/docs/configuration/
# Connexion : https://app.pagescms.org (compte GitHub)

media:
  input: src/media      # dossier du dépôt où sont enregistrées les images
  output: /media        # chemin écrit dans les contenus

content:
  - name: actualites
    label: Actualités
    type: collection
    path: src/actualites
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: resume
        label: Résumé (liste d'accueil)
        type: text
      - name: image
        label: Image de couverture
        type: image
      - name: body
        label: Contenu
        type: rich-text

  - name: a-propos
    label: Page « À propos »
    type: file
    path: src/a-propos.md
    fields:
      - name: layout
        type: string
        hidden: true
        default: base.njk
      - name: permalink
        type: string
        hidden: true
        default: /a-propos/
      - name: title
        label: Titre
        type: string
      - name: body
        label: Contenu
        type: rich-text

  - name: site
    label: Réglages du site
    type: file
    path: src/_data/site.json
    fields:
      - name: title
        label: Nom du site
        type: string
      - name: description
        label: Description
        type: text
      - name: footer
        label: Pied de page
        type: string
