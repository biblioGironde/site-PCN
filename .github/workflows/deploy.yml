# Récupère la liste des dépôts de l'organisation et publie la page sur GitHub Pages.
# Se lance à chaque modification, tous les jours à 6 h (heure de Paris), ou à la main.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp index.html style.css app.js config.json _site/
      - name: Lister les dépôts de l'organisation
        run: node scripts/fetch-repos.mjs _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Capturer les pages GitHub Pages des dépôts
        continue-on-error: true # en cas d'échec, les images GitHub restent affichées
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
          node scripts/capture.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
